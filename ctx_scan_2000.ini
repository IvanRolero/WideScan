; This file can be used to change the behavior of the WIDEsystem driver

[LOG]
TRACELEVEL=0
SRB_BEFORE=OFF
SRB_AFTER=OFF
SRB_IO=OFF
DAYS=30

[USB]
DEVICECHANGE=OFF

[IP]
IP_TIMEOUT_SECS=5
ENFORCE_DNS=OFF
MIN_SCAN_SIZE_MB=10
AutoIP=169.254.
AutoMask=255.255.0.0
AutoAdapterType=6

[UDP]
BUFFERSIZE=32
TESTBEFORESCAN=1

[CHECK_LINE_LENGTH]
ENABLE=OFF
MAX_ERRORS=10
BEEP_ON_ERROR=ON
[MAIN]
Code=en-US

; 
; The [LOG] section contains settings that can be used to enable
; data logging. The result can be found in the file CTX_SCAN_2000.LOG
; This should only be used for system debugging, as it slows down 
; scanning significantly.
; TRACELEVEL        Set to 0, 1, 2 , ... Higher level gives more log/trace. O means no tracing
; GLOBAL_ENABLE     Set to ON enables logging NOT USED: MUST USE TRACELEVEL!
; SRB_BEFORE        Set to ON logs the SCSI Request Block before 
;                   the SCSI command is executed.
; SRB_AFTER         Set to ON logs the SCSI Request Block after 
;                   the SCSI command is executed.
; SRB_IO            Set to ON logs all data send over the SCSI bus.
;                   This will create a huge LOG file!
; 
;
; The [USB] sections controls the USB connection
; DEVICECHANGE      Set to ON when change of USB devices should trigger a scanner list refresh
; 
;
; The [IP] section allows to set selected variables for optimizing networking
; IP_TIMEOUT_SECS   Set the timeout (in seconds) before aborting a connection to a scanner
;                   on the network. This is good for minimizing delay when starting applications
;                   if some remote scanner(s) are often offline. Default is 5 seconds.
; ENFORCE_DNS	    Set to ON if DNS name should be used to resolve the scanner IP address.
; MIN_SCAN_SIZE_MB  Is used on some Ethernet scanners to control when to update the scan speed
; AutoIP            Auto configuration network address 
; AutoMask          Auto configuration network mask 
; AutoAdapterType   Adapters used with Auto configuration network
;
;
; The [UDP] section is used to control data transfer on scanners with Gigabit Ethernet
; BUFFERSIZE controls the size in MB of the buffer used to receive image data
; TESTBEFORESCAN can be set to 0 to turn off the UDP speed test prior to a scan 
;
;
; The [CHECK_LINE_LENGTH] section allows to check the validity of RLC data.
; This should only be used for system debugging, as it slows down 
; scanning significantly.
; ENABLE            Set to ON enables line length checking and trace any length read errors.
;                   If an error in the line length is detected a dump of a partial
;                   image is put in a 'contex data format' (.cdf) file in the current folder.
;                   The actual name of the file is written in ctx_scan_2000.log
; MAX_ERRORS        Maximum number of errors reported.
; BEEP_ON_ERROR     Beeps if an error is detected.
;
